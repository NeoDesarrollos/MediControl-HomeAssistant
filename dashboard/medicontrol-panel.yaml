# Panel MediControl para Home Assistant
# 1. Sustituye TU_EQUIPO por el identificador de tu pastillero (ver README).
# 2. Requisitos de HACS (Frontend): button-card y card-mod.
# 3. Ajustes > Paneles > Añadir panel > abre el panel > Editar > Editor de configuración en bruto,
#    y pega esta vista dentro de "views:".
title: MediControl
path: MediControl
type: sections
icon: mdi:pill-multiple
subview: false
max_columns: 3
sections:
- type: grid
  column_span: 1
  cards:
  - type: markdown
    text_only: true
    title: null
    content: <center><img src="data:image/svg+xml;base64,"
      width="300" alt="MediControl"></center>
    card_mod:
      style: 'ha-card { background: none !important; border: none !important; box-shadow: none !important; backdrop-filter: none !important; padding: 8px 0 4px !important; }'
  - type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    triggers_update:
    - sensor.TU_EQUIPO_proxima_toma
    - sensor.TU_EQUIPO_proximos_medicamentos
    - sensor.TU_EQUIPO_horarios_y_medicamentos
    custom_fields:
      body: |-
        [[[
         const raw = states['sensor.TU_EQUIPO_horarios_y_medicamentos']?.state || '';
         const lista = raw.split('|').map(t => t.trim()).filter(t => /^\d{2}:\d{2}/.test(t)).map(t => ({h: t.slice(0,5), m: t.slice(6).replace(/^:?\s*/,'')}));
         const now = new Date(); const minNow = now.getHours()*60 + now.getMinutes();
         const aMin = s => parseInt(s.slice(0,2))*60 + parseInt(s.slice(3,5));

         const hora = states['sensor.TU_EQUIPO_proxima_toma']?.state || '--:--';
         const meds = (states['sensor.TU_EQUIPO_proximos_medicamentos']?.state || '').split(',').map(x => x.trim()).filter(Boolean);
         let falta = /^\d{2}:\d{2}$/.test(hora) ? (aMin(hora) - minNow + 1440) % 1440 : null;
         const prev = lista.map(x => aMin(x.h)).filter(m => /^\d{2}:\d{2}$/.test(hora) && m !== aMin(hora));
         let tramo = 1440;
         if (prev.length && falta !== null) { const objetivo = aMin(hora); const ant = prev.map(m => (objetivo - m + 1440) % 1440).sort((a,b)=>a-b)[0]; tramo = ant || 1440; }
         const pct = falta === null ? 0 : Math.max(0, Math.min(1, 1 - falta / tramo));
         const r = 74, c = 2*Math.PI*r, off = c*(1-pct);
         const txtFalta = falta === null ? 'Sin horario' : (falta >= 60 ? 'en ' + Math.floor(falta/60) + ' h ' + String(falta%60).padStart(2,'0') + ' min' : 'en ' + falta + ' min');
         const chips = meds.map(m => '<span class="chip">' + m + '</span>').join('') || '<span class="mut">Sin medicamentos</span>';
         return '<div class="eb">Próxima toma</div><div class="hero"><svg viewBox="0 0 170 170" class="ring"><circle cx="85" cy="85" r="'+r+'" class="tr"/><circle cx="85" cy="85" r="'+r+'" class="pr" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/></svg><div class="center"><div class="h">'+hora+'</div><div class="f">'+txtFalta+'</div></div></div><div class="chips">'+chips+'</div>';
        ]]]
    styles:
      card:
      - padding: 20px 22px
      - border-radius: 22px
      - box-sizing: border-box
      - overflow: hidden
      - background: linear-gradient(160deg, rgba(30,41,59,.72), rgba(15,23,42,.62))
      - border: 1px solid rgba(148,163,184,.16)
      - box-shadow: 0 10px 30px rgba(2,6,23,.35)
      - backdrop-filter: blur(14px)
      - -webkit-backdrop-filter: blur(14px)
      grid:
      - grid-template-areas: '"body"'
      - grid-template-columns: 1fr
      custom_fields:
        body:
        - width: 100%
        - align-self: stretch
        - justify-self: stretch
        - text-align: left
    extra_styles: .eb{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#94a3b8}.mut{color:#94a3b8}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.hero{position:relative;width:190px;height:190px;margin:14px auto 6px}.ring{width:190px;height:190px;transform:rotate(-90deg)}.tr{fill:none;stroke:rgba(148,163,184,.14);stroke-width:10}.pr{fill:none;stroke:url(#g);stroke:#2dd4bf;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s}.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.h{font-size:46px;font-weight:800;color:#f8fafc;letter-spacing:-.02em;line-height:1}.f{font-size:13px;color:#5eead4;font-weight:700;margin-top:6px}.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.chip{font-size:12px;font-weight:700;color:#ccfbf1;background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.28);padding:5px 10px;border-radius:999px}
    tap_action:
      action: none
    update_timer: 30000
  - type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    triggers_update:
    - sensor.TU_EQUIPO_adelanto_de_toma
    custom_fields:
      body: |-
        [[[
         const a = states['sensor.TU_EQUIPO_adelanto_de_toma']?.attributes || {};
         const m = {ya_adelantada:'Ya hay una toma adelantada hoy',sin_toma_hoy:'No quedan tomas hoy',saltadas:'Hay tomas saltadas pendientes',sin_hora:'El equipo no tiene hora',motor:'El motor está girando',aviso:'Hay un aviso en pantalla',vacio:'Pastillero vacío',ota:'Actualizando',demo:'Modo demostración'};
         let t, s, col;
         if (a.pendiente) { t = 'Esperando confirmación'; s = 'Toma de las ' + a.pendiente + ' · 2 min para confirmar'; col = '#fbbf24'; }
         else if (a.adelantada) { t = 'Toma adelantada'; s = 'La de las ' + a.adelantada + ' ya está dispensada'; col = '#4ade80'; }
         else if (a.proxima_adelantable) { t = 'Puedes adelantar'; s = 'La toma de las ' + a.proxima_adelantable; col = '#38bdf8'; }
         else { t = 'No disponible'; s = a.motivo ? (m[a.motivo] || a.motivo) : 'Sin datos'; col = '#64748b'; }
         return '<div class="eb">Adelantar toma</div><div class="st"><span class="dotc" style="background:'+col+';box-shadow:0 0 0 5px '+col+'22"></span><div><div class="t">'+t+'</div><div class="s">'+s+'</div></div></div>';
        ]]]
    styles:
      card:
      - padding: 20px 22px
      - border-radius: 22px
      - box-sizing: border-box
      - overflow: hidden
      - background: linear-gradient(160deg, rgba(30,41,59,.72), rgba(15,23,42,.62))
      - border: 1px solid rgba(148,163,184,.16)
      - box-shadow: 0 10px 30px rgba(2,6,23,.35)
      - backdrop-filter: blur(14px)
      - -webkit-backdrop-filter: blur(14px)
      grid:
      - grid-template-areas: '"body"'
      - grid-template-columns: 1fr
      custom_fields:
        body:
        - width: 100%
        - align-self: stretch
        - justify-self: stretch
        - text-align: left
    extra_styles: .eb{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#94a3b8}.mut{color:#94a3b8}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.st{display:flex;align-items:center;gap:14px;margin-top:12px}.dotc{width:12px;height:12px;border-radius:50%;flex:none}.t{font-size:17px;font-weight:800;color:#f1f5f9}.s{font-size:12px;color:#94a3b8;margin-top:2px}
    tap_action:
      action: none
- type: grid
  column_span: 1
  cards:
  - type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    triggers_update:
    - sensor.TU_EQUIPO_horarios_y_medicamentos
    - sensor.TU_EQUIPO_proxima_toma
    - sensor.TU_EQUIPO_adelanto_de_toma
    custom_fields:
      body: |-
        [[[
         const raw = states['sensor.TU_EQUIPO_horarios_y_medicamentos']?.state || '';
         const lista = raw.split('|').map(t => t.trim()).filter(t => /^\d{2}:\d{2}/.test(t)).map(t => ({h: t.slice(0,5), m: t.slice(6).replace(/^:?\s*/,'')}));
         const now = new Date(); const minNow = now.getHours()*60 + now.getMinutes();
         const aMin = s => parseInt(s.slice(0,2))*60 + parseInt(s.slice(3,5));

         const sig = states['sensor.TU_EQUIPO_proxima_toma']?.state || '';
         const adel = (states['sensor.TU_EQUIPO_adelanto_de_toma']?.attributes || {}).adelantada || '';
         const items = lista.map(x => {
           let est = 'pend', txt = 'Pendiente';
           if (x.h === adel) { est = 'done'; txt = 'Adelantada'; }
           else if (aMin(x.h) <= minNow) { est = 'done'; txt = 'Dispensada'; }
           else if (x.h === sig) { est = 'next'; txt = 'Siguiente'; }
           return '<div class="it '+est+'"><div class="tl"><span class="b"></span></div><div class="hh">'+x.h+'</div><div class="mm">'+x.m+'</div><span class="pill">'+txt+'</span></div>';
         }).join('');
         return '<div class="row"><div class="eb">Agenda de hoy</div><div class="mut sm">'+lista.length+' tomas</div></div><div class="list">'+(items || '<div class="mut">Sin horarios</div>')+'</div>';
        ]]]
    styles:
      card:
      - padding: 20px 22px
      - border-radius: 22px
      - box-sizing: border-box
      - overflow: hidden
      - background: linear-gradient(160deg, rgba(30,41,59,.72), rgba(15,23,42,.62))
      - border: 1px solid rgba(148,163,184,.16)
