    tap_action:
      action: none
  - type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    triggers_update:
    - sensor.TU_EQUIPO_rssi
    - sensor.TU_EQUIPO_wifi
    - sensor.TU_EQUIPO_ip
    - sensor.TU_EQUIPO_uptime
    - sensor.TU_EQUIPO_memoria
    - sensor.TU_EQUIPO_firmware
    custom_fields:
      body: |-
        [[[
         const g = k => states['sensor.TU_EQUIPO_' + k]?.state;
         const rssi = parseInt(g('rssi') || -100);
         const nb = rssi >= -55 ? 4 : rssi >= -65 ? 3 : rssi >= -75 ? 2 : rssi >= -85 ? 1 : 0;
         const bars = [1,2,3,4].map(i => '<i class="'+(i <= nb ? 'on' : '')+'" style="height:'+(i*4+2)+'px"></i>').join('');
         const up = parseInt(g('uptime') || 0);
         const d = Math.floor(up/86400), hh = Math.floor(up%86400/3600), mm = Math.floor(up%3600/60);
         const upt = d ? d + ' d ' + hh + ' h' : (hh ? hh + ' h ' + mm + ' min' : mm + ' min');
         const fila = (k, v) => '<div class="row li"><span class="mut">'+k+'</span><span>'+v+'</span></div>';
         return '<div class="row"><div class="eb">Equipo</div><span class="fw">v' + (g('firmware') || '?') + '</span></div>'
          + '<div class="wifi"><div class="bars">'+bars+'</div><div><div class="t">'+(g('wifi') || '—')+'</div><div class="s">'+rssi+' dBm · '+(g('ip') || '')+'</div></div></div>'
          + fila('Encendido', upt) + fila('Memoria libre', (g('memoria') || '?') + ' KB');
        ]]]
    styles:
      card:
      - padding: 20px 22px
      - border-radius: 22px
      - box-sizing: border-box
      - overflow: hidden
      - background: linear-gradient(160deg, rgba(30,41,59,.72), rgba(15,23,42,.62))
