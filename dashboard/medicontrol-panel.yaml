      grid:
      - grid-template-areas: '"body"'
      - grid-template-columns: 1fr
      custom_fields:
        body:
        - width: 100%
        - align-self: stretch
        - justify-self: stretch
        - text-align: left
    extra_styles: .eb{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#94a3b8}.mut{color:#94a3b8}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.sm{font-size:11px}.list{margin-top:14px;display:flex;flex-direction:column}.it{display:grid;grid-template-columns:14px 52px minmax(0,1fr) max-content;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(148,163,184,.10)}.it:last-child{border-bottom:0}.tl{display:flex;justify-content:center}.b{width:10px;height:10px;border-radius:50%;background:#475569}.hh{font-size:18px;font-weight:800;color:#e2e8f0;font-variant-numeric:tabular-nums}.mm{font-size:13px;color:#cbd5e1;line-height:1.3;white-space:normal;overflow-wrap:anywhere}.pill{font-size:10px;font-weight:800;padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;background:rgba(100,116,139,.18);color:#94a3b8}.done .b{background:#4ade80}.done .hh,.done .mm{color:#64748b}.done .pill{background:rgba(74,222,128,.12);color:#86efac}.next .b{background:#2dd4bf;box-shadow:0 0 0 5px rgba(45,212,191,.18)}.next .pill{background:rgba(45,212,191,.16);color:#5eead4}
    tap_action:
      action: none
    update_timer: 60000
  - type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    triggers_update:
    - sensor.TU_EQUIPO_dias_restantes
    - sensor.TU_EQUIPO_compartimentos_restantes
    - sensor.TU_EQUIPO_compartimentos_maximos
    - sensor.TU_EQUIPO_medicamentos_hasta
    - sensor.TU_EQUIPO_ultimo_rellenado
    custom_fields:
      body: |-
        [[[
         const dias = states['sensor.TU_EQUIPO_dias_restantes']?.state || '--';
         const rest = parseInt(states['sensor.TU_EQUIPO_compartimentos_restantes']?.state || 0);
         const max = parseInt(states['sensor.TU_EQUIPO_compartimentos_maximos']?.state || 30) || 30;
         const usados = Math.max(0, max - rest);
         const hasta = states['sensor.TU_EQUIPO_medicamentos_hasta']?.state || '';
         const rell = states['sensor.TU_EQUIPO_ultimo_rellenado']?.state || '';
         const fmt = s => { const d = new Date(s.replace(' ', 'T')); return isNaN(d) ? '—' : d.toLocaleDateString('es-ES', {day:'numeric', month:'short'}); };
         const n = parseInt(dias); const col = n <= 2 ? '#fb7185' : (n <= 5 ? '#fbbf24' : '#2dd4bf');
         const R = 46;
         const dots = Array.from({length: max}, (_, i) => {
           const ang = (-90 + (i + 0.5) * 360 / max) * Math.PI / 180;
           const x = 50 + R * Math.cos(ang), y = 50 + R * Math.sin(ang);
           return '<i class="'+(i < usados ? 'u' : 'l')+'" style="left:'+x.toFixed(2)+'%;top:'+y.toFixed(2)+'%"></i>';
         }).join('');
         return '<div class="eb">Casilleros</div><div class="ruleta"><div class="sal"><span>Salida</span><b></b></div>'+dots+'<div class="mid"><div class="cnt"><b>'+rest+'</b>/'+max+'</div><div class="d" style="color:'+col+'">'+dias+'</div><div class="dl">días de medicación</div><div class="fx">Hasta '+fmt(hasta)+'</div><div class="fx mut">Rellenado '+fmt(rell)+'</div></div></div>';
        ]]]
    styles:
      card:
      - padding: 20px 22px
      - border-radius: 22px
      - box-sizing: border-box
      - overflow: hidden
      - background: linear-gradient(160deg, rgba(30,41,59,.72), rgba(15,23,42,.62))
      - border: 1px solid rgba(148,163,184,.16)
      - box-shadow: 0 10px 30px rgba(2,6,23,.35)
      - backdrop-filter: blur(14px)
      - -webkit-backdrop-filter: blur(14px)
      grid:
      - grid-template-areas: '"body"'
      - grid-template-columns: 1fr
      custom_fields:
        body:
        - width: 100%
        - align-self: stretch
        - justify-self: stretch
        - text-align: left
    extra_styles: .eb{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#94a3b8}.mut{color:#94a3b8}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.ruleta{position:relative;width:250px;height:250px;margin:12px auto 4px}.ruleta i{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%}.ruleta .u{background:rgba(148,163,184,.14);box-shadow:inset 0 0 0 1px rgba(148,163,184,.2)}.ruleta .l{background:linear-gradient(145deg,#5eead4,#0d9488);box-shadow:0 0 0 1px rgba(45,212,191,.25),0 2px 6px rgba(13,148,136,.35)}.mid{position:absolute;inset:30px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle,rgba(45,212,191,.07),transparent 70%)}.ruleta{position:relative;width:250px;height:250px;margin:30px auto 4px}.sal{position:absolute;left:50%;top:-24px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:1}.sal span{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);padding:2px 7px;border-radius:999px}.sal b{width:2px;height:22px;border-radius:2px;background:linear-gradient(#fbbf24,rgba(251,191,36,0))}.ruleta i{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%}.ruleta .u{background:rgba(148,163,184,.14);box-shadow:inset 0 0 0 1px rgba(148,163,184,.2)}.ruleta .l{background:linear-gradient(145deg,#5eead4,#0d9488);box-shadow:0 0 0 1px rgba(45,212,191,.25),0 2px 6px rgba(13,148,136,.35)}.mid{position:absolute;inset:30px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle,rgba(45,212,191,.07),transparent 70%)}.cnt{font-size:12px;color:#94a3b8;font-weight:700}.cnt b{font-size:16px;color:#f1f5f9;font-weight:800}.d{font-size:54px;font-weight:800;line-height:1;letter-spacing:-.03em;margin-top:2px}.dl{font-size:12px;color:#cbd5e1;font-weight:600;margin-top:2px}.fx{font-size:11px;color:#e2e8f0;font-weight:600;margin-top:6px}.fx+.fx{margin-top:2px}
    tap_action:
      action: none
- type: grid
  column_span: 1
  cards:
  - type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    triggers_update:
    - sensor.TU_EQUIPO_tomas_saltadas
    - sensor.TU_EQUIPO_actualizacion
    - sensor.TU_EQUIPO_firmware
    custom_fields:
      body: |-
        [[[
         const n = parseInt(states['sensor.TU_EQUIPO_tomas_saltadas']?.state || 0);
         const up = states['sensor.TU_EQUIPO_actualizacion']?.state || '';
         const fw = states['sensor.TU_EQUIPO_firmware']?.state || '?';
         const al = [];
         if (n > 0) al.push(['r', 'mdi:pill-off', n + (n === 1 ? ' toma sin dispensar' : ' tomas sin dispensar'), 'Revisa la pantalla del pastillero']);
         if (up && up !== 'Sin actualizaciones') al.push(['a', 'mdi:download', up, 'Firmware actual ' + fw]);
         if (!al.length) return '<div class="eb">Avisos</div><div class="ok"><span class="okd"></span><div><div class="t">Todo en orden</div><div class="s">Sin tomas saltadas · firmware ' + fw + ' al día</div></div></div>';
         return '<div class="eb">Avisos</div>' + al.map(x => '<div class="al '+x[0]+'"><ha-icon icon="'+x[1]+'"></ha-icon><div><div class="t">'+x[2]+'</div><div class="s">'+x[3]+'</div></div></div>').join('');
        ]]]
